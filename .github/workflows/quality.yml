name: Quality

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release_state.py

  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [stdlib, structlog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evals/demo/requirements-${{ matrix.stack }}.txt
      - run: python -m pip install -r evals/demo/requirements-${{ matrix.stack }}.txt
      - run: python -m unittest discover -s tests/demo -v
        env:
          DEMO_TEST_STACK: ${{ matrix.stack }}
